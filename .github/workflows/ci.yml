name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (offline, scripted models)
        run: pytest
      - name: Dependency vulnerability scan (the project's own dependencies)
        run: pip install pip-audit && pip-audit .
      - name: Replay the recorded trajectory evaluation (safety gate)
        if: hashFiles('evals/recordings/**') != ''
        env:
          GOVAGENTS_OFFLINE: "1"
          GOVAGENTS_RECORDINGS: evals/recordings
          GOVAGENTS_ENABLE_MCP: "false"
        run: govagents eval evals/cases.jsonl
      - name: Replay the local open-weight runs (safety gate)
        run: |
          # evals/recordings-<model with ':' as '-'>, e.g. recordings-llama3.1-8b-ctx8k
          for dir in evals/recordings-*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir"); name=${name#recordings-}; model=${name/-/:}
            echo "replaying $model"
            GOVAGENTS_OFFLINE=1 GOVAGENTS_PROVIDER=openai_compatible \
            GOVAGENTS_MODEL_FAST="$model" GOVAGENTS_MODEL_STRONG="$model" \
            GOVAGENTS_RECORDINGS="$dir" GOVAGENTS_ENABLE_MCP=false \
              govagents eval evals/cases.jsonl
          done

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t governed-agents .
      - name: Start it and check health, identity and the approvals page
        run: |
          docker run -d --name agents -p 127.0.0.1:8090:8090 \
            -e GOVAGENTS_API_TOKENS="ci:approver:ci-approver-token-0001" governed-agents
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci-approver-token-0001" http://127.0.0.1:8090/api/me
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/runs)" = "401"
          curl -fsS http://127.0.0.1:8090/ | grep -q "Agent approvals"
          curl -fsS http://127.0.0.1:8090/metrics | grep -q govagents_approvals
      - name: Container logs
        if: always()
        run: docker logs agents
