[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "governed-agents"
version = "0.1.0"
description = "A reference architecture for governed multi-agent systems: specialist agents, MCP tools, autonomy enforced in code, durable human approval, full audit trace and trajectory evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["ai-agents", "multi-agent", "agentic", "governance", "human-in-the-loop", "mcp", "anthropic"]
dependencies = [
    "anthropic>=1.0,<2",  # Claude with native tool use
    "httpx>=0.27,<1",     # OpenAI-compatible endpoints (an LLM gateway, Ollama)
    "mcp>=2.2,<3",        # tools from MCP servers
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
govagents = "govagents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/govagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
