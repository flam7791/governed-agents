[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "governed-agents"
version = "0.3.0"
description = "A reference architecture for governed multi-agent systems: specialist agents, MCP tools, autonomy enforced in code, durable human approval (CLI or web), full audit trace, metrics and trajectory evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["ai-agents", "multi-agent", "agentic", "governance", "human-in-the-loop", "mcp", "anthropic"]
dependencies = [
    "anthropic>=1.0,<2",  # Claude with native tool use
    "httpx>=0.28.1,<1",     # OpenAI-compatible endpoints (an LLM gateway, Ollama)
    "mcp>=2.2,<3",        # tools from MCP servers
    "opentelemetry-api>=1.25,<2",  # tracing hooks; no-op unless the tracing extra is set up
]

[project.optional-dependencies]
# The HTTP service, approvals page and metrics (govagents serve)
server = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20"]
tracing = ["opentelemetry-sdk>=1.25,<2", "opentelemetry-exporter-otlp-proto-http>=1.25,<2"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25,<2",
]

[project.scripts]
govagents = "govagents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/govagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

# Recorded exceptions to the engineering standards (checked by aief check).
[tool.aief.waivers]
ENG-11 = "Operated as a component of governed-ai-platform: see its docs/runbook.md and docs/lifecycle.md"
